name: Auto-Update Factorio Images

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  MAJOR_FILTER: ${{ vars.MAJOR_FILTER || '^1\.' }} 

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      new_versions: ${{ steps.compare.outputs.new_versions }}
    steps:
      - name: Get Official Versions
        id: official
        run: |
          # Obtenemos todas las versiones 'to' y la 'stable' actual
          DATA=$(curl -s https://updater.factorio.com/get-available-versions)
          VERSIONS=$(echo "$DATA" | jq -r '.["core-linux_headless64"] | map(.to // .stable) | unique | .[]' | grep -E "${{ env.MAJOR_FILTER }}" | sort -V | tail -n 100 | jq -R . | jq -s -c .)
          echo "official=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Get Docker Hub Tags
        id: dockerhub
        run: |
          # Manejamos el caso de que el repo no exista o esté vacío
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless/tags/?page_size=100")
          TAGS=$(echo "$RESPONSE" | jq -r '.results[].name // empty' | jq -R . | jq -s -c . || echo "[]")
          echo "existing=$TAGS" >> $GITHUB_OUTPUT

      - name: Compare and Filter
        id: compare
        run: |
          OFFICIAL='${{ steps.official.outputs.official }}'
          EXISTING='${{ steps.dockerhub.outputs.existing }}'
          [ -z "$EXISTING" ] && EXISTING="[]"
          NEW=$(echo $OFFICIAL | jq -c "[.[] | select(. as \$v | $(echo $EXISTING) | index(\$v) | not)]")
          echo "new_versions=$NEW" >> $GITHUB_OUTPUT

  build-new:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.new_versions != '[]' && needs.check-versions.outputs.new_versions != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRÍTICO: Necesario para crear la Release y subir archivos
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.check-versions.outputs.new_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine if Latest
        id: info
        run: |
          # Extraemos la versión más alta del array original para el tag 'latest'
          HIGHEST_VERSION=$(echo '${{ needs.check-versions.outputs.new_versions }}' | jq -r '.[-1]')
          echo "highest=$HIGHEST_VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. PUSH MULTI-ARCH A DOCKER HUB
      - name: Build and Push (Multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: FACTORIO_VERSION=${{ matrix.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}
            ${{ matrix.version == steps.info.outputs.highest && format('{0}/factorio-headless:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          platforms: linux/amd64,linux/arm64

      # 2. EXPORTAR TARBALL (Solo amd64 para evitar error de manifest list)
      - name: Build and Export Tarball (amd64 only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          build-args: FACTORIO_VERSION=${{ matrix.version }}
          tags: factorio-export:${{ matrix.version }}
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/factorio-headless-${{ matrix.version }}.tar

      - name: Compress Image
        run: gzip -9 /tmp/factorio-headless-${{ matrix.version }}.tar

      # 3. CREAR RELEASE Y SUBIR EL ARCHIVO EXPORTADO
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: Factorio Headless v${{ matrix.version }}
          body: |
            Automated release for Factorio version ${{ matrix.version }}.
            
            **Docker Hub Image:** `${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}`
            
            *The attached `.tar.gz` file contains the Docker image for linux/amd64 (loadable via `docker load`).*
          files: /tmp/factorio-headless-${{ matrix.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
