name: Auto-Update Factorio Images

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  MAJOR_FILTER: ${{ vars.MAJOR_FILTER || '2.0|1.1' }} 

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      new_versions: ${{ steps.compare.outputs.new_versions }}
    steps:
      - name: Get Official Versions
        id: official
        run: |
          # Obtenemos todas las versiones 'to' y la 'stable' actual
          DATA=$(curl -s https://updater.factorio.com/get-available-versions)
          VERSIONS=$(echo "$DATA" | jq -r '.["core-linux_headless64"] | map(.to // .stable) | unique | .[]' | grep -E "${{ env.MAJOR_FILTER }}" | sort -V | tail -n 5 | jq -R . | jq -s -c .)
          echo "official=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Get Docker Hub Tags
        id: dockerhub
        run: |
          # Manejamos el caso de que el repo no exista o esté vacío
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless/tags/?page_size=100")
          TAGS=$(echo "$RESPONSE" | jq -r '.results[].name // empty' | jq -R . | jq -s -c . || echo "[]")
          echo "existing=$TAGS" >> $GITHUB_OUTPUT

      - name: Compare and Filter
        id: compare
        run: |
          OFFICIAL='${{ steps.official.outputs.official }}'
          EXISTING='${{ steps.dockerhub.outputs.existing }}'
          [ -z "$EXISTING" ] && EXISTING="[]"
          NEW=$(echo $OFFICIAL | jq -c "[.[] | select(. as \$v | $(echo $EXISTING) | index(\$v) | not)]")
          echo "new_versions=$NEW" >> $GITHUB_OUTPUT

  build-new:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.new_versions != '[]' && needs.check-versions.outputs.new_versions != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.check-versions.outputs.new_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: FACTORIO_VERSION=${{ matrix.version }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ matrix.version }}
          name: Factorio Headless v${{ matrix.version }}
          body: "Automated multi-arch release for ${{ matrix.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
