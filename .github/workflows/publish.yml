name: Publish Multi-Arch Factorio Images

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Range of versions to build'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - stable_2.0
          - stable_1.1
          - custom
      custom_version:
        description: 'Specific version (if custom is selected)'
        required: false
        default: '2.0.13'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get_versions.outputs.versions }}
    steps:
      - id: get_versions
        run: |
          if [ "${{ github.event.inputs.version_type }}" == "latest" ]; then
            VERSIONS='["2.0.13"]'
          elif [ "${{ github.event.inputs.version_type }}" == "stable_2.0" ]; then
            VERSIONS='["2.0.11", "2.0.12", "2.0.13"]'
          elif [ "${{ github.event.inputs.version_type }}" == "stable_1.1" ]; then
            VERSIONS='["1.1.110"]'
          else
            VERSIONS='["${{ github.event.inputs.custom_version }}"]'
          fi
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            FACTORIO_VERSION=${{ matrix.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:latest
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ matrix.version }}
          name: Factorio Headless v${{ matrix.version }}
          body: |
            ## Factorio Headless Server v${{ matrix.version }}
            
            Multi-arch Docker image published for **Linux**, **Windows**, **macOS** and **ChromeOS** (via Docker).
            
            ### Supported Architectures:
            - `linux/amd64` (Standard PC)
            - `linux/arm64` (Apple Silicon, Raspberry Pi, etc.)
            
            ### Usage:
            `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
