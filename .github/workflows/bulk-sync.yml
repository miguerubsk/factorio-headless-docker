name: Bulk Sync Factorio History

on:
  workflow_dispatch:
    inputs:
      major_filter:
        description: 'Major version to sync (e.g., 1.1 or 2.0)'
        required: true
        default: '2.0'
      limit:
        description: 'Max number of versions to build'
        required: true
        default: '15'

jobs:
  find-missing:
    runs-on: ubuntu-latest
    outputs:
      missing_versions: ${{ steps.compare.outputs.missing }}
    steps:
      - name: Get All Official Versions
        id: official
        run: |
          DATA=$(curl -s https://updater.factorio.com/get-available-versions)
          ALL=$(echo "$DATA" | jq -r '.["core-linux_headless64"] | map(.to // .stable) | unique | .[]' | grep "^${{ github.event.inputs.major_filter }}" | sort -V | jq -R . | jq -s -c .)
          echo "all=$ALL" >> $GITHUB_OUTPUT

      - name: Get Docker Hub Tags
        id: dockerhub
        run: |
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless/tags/?page_size=100")
          TAGS=$(echo "$RESPONSE" | jq -r '.results[].name // empty' | jq -R . | jq -s -c . || echo "[]")
          echo "existing=$TAGS" >> $GITHUB_OUTPUT

      - name: Compare and Limit
        id: compare
        run: |
          ALL='${{ steps.official.outputs.all }}'
          EXISTING='${{ steps.dockerhub.outputs.existing }}'
          [ -z "$EXISTING" ] && EXISTING="[]"
          LIMIT=${{ github.event.inputs.limit }}
          MISSING=$(echo $ALL | jq -c "[.[] | select(. as \$v | $(echo $EXISTING) | index(\$v) | not)] | .[0:$LIMIT]")
          echo "missing=$MISSING" >> $GITHUB_OUTPUT

  build-bulk:
    needs: find-missing
    if: ${{ needs.find-missing.outputs.missing_versions != '[]' && needs.find-missing.outputs.missing_versions != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.find-missing.outputs.missing_versions) }}
      max-parallel: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: FACTORIO_VERSION=${{ matrix.version }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless:${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ matrix.version }}
          name: Factorio Headless v${{ matrix.version }}
          body: "Bulk-sync multi-arch build for ${{ matrix.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
