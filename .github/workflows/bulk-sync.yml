name: Bulk Sync Factorio History

on:
  workflow_dispatch:
    inputs:
      major_filter:
        description: 'Major version (e.g., 1.0 or 1.1)'
        required: true
        default: '1.0'
      limit:
        description: 'Max number of versions'
        required: true
        default: '15'

permissions:
  contents: write

jobs:
  find-missing:
    runs-on: ubuntu-latest
    outputs:
      missing_versions: ${{ steps.compare.outputs.missing }}
    steps:
      - name: Get All Official Versions
        id: official
        run: |
          DATA=$(curl -s https://updater.factorio.com/get-available-versions)
          # Extraemos versiones, filtramos por el prefijo, quitamos duplicados y ordenamos
          ALL=$(echo "$DATA" | jq -r '.["core-linux_headless64"] | .[] | (.to, .stable) | select(. != null)' | grep "^${{ github.event.inputs.major_filter }}" | sort -uV | jq -R . | jq -s -c .)
          echo "all=$ALL" >> $GITHUB_OUTPUT

      - name: Get Docker Hub Tags
        id: dockerhub
        run: |
          # Usamos el nombre correcto del repositorio: factorio-headless-docker
          RESPONSE=$(curl -s "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless-docker/tags/?page_size=100")
          TAGS=$(echo "$RESPONSE" | jq -c '[.results[].name] // []' || echo "[]")
          echo "existing=$TAGS" >> $GITHUB_OUTPUT

      - name: Compare and Limit
        id: compare
        run: |
          ALL='${{ steps.official.outputs.all }}'
          EXISTING='${{ steps.dockerhub.outputs.existing }}'
          LIMIT=${{ github.event.inputs.limit }}
          # Calculamos cuáles faltan y aplicamos el LÍMITE de 15 (o el que pongas en el input)
          MISSING=$(jq -c -n --argjson all "$ALL" --argjson ext "$EXISTING" \
            '$all | [ .[] | select(. as $v | $ext | index($v) | not) ] | .[0:'"$LIMIT"']')
          echo "missing=$MISSING" >> $GITHUB_OUTPUT

  build-bulk:
    needs: find-missing
    if: ${{ needs.find-missing.outputs.missing_versions != '[]' && needs.find-missing.outputs.missing_versions != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.find-missing.outputs.missing_versions) }}
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: FACTORIO_VERSION=${{ matrix.version }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/factorio-headless-docker:${{ matrix.version }}
          platforms: linux/amd64,linux/arm64

      - name: Export Image to Tarball
        run: |
          # Exportamos la versión AMD64 para el artifact de GitHub (es la más compatible)
          docker buildx build --platform linux/amd64 \
            --build-arg FACTORIO_VERSION=${{ matrix.version }} \
            -t factorio-v${{ matrix.version }} \
            --output type=docker,dest=factorio-v${{ matrix.version }}.tar .

      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: Factorio Headless v${{ matrix.version }}
          body: "Multi-arch build (linux/amd64, linux/arm64) for version ${{ matrix.version }}"
          files: factorio-v${{ matrix.version }}.tar
