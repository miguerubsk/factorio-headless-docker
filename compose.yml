services:
  factorio:
    container_name: factorio-server
    image: miguerubsk/factorio-headless:2.0.13
    restart: unless-stopped
    
    # Monitoring: Ensures the process is alive
    healthcheck:
      test: ["CMD", "pgrep", "factorio"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    ports:
      - "34197:34197/udp" # Game Port
      - "27015:27015/tcp" # RCON Port

    environment:
      # --- Basic Configuration ---
      - SAVE_NAME=factory_world
      - RCON_ENABLED=true
      - RCON_PASSWORD=factorio_secure_pass

      # --- Autonomous Updates (Recommended) ---
      - GAME_AUTO_UPDATE=true
      - GAME_UPDATE_SCHEDULE=04:00 # Checks for new versions at 4 AM
      - MODS_AUTO_UPDATE=true
      - MODS_UPDATE_SCHEDULE=04:00 # Checks for mod updates at 4 AM
      
      # Required for Official Mod Portal updates
      - FACTORIO_USER=your_username
      - FACTORIO_TOKEN=your_service_token

      # --- Space Age DLC (Factorio 2.0+) ---
      - DLC_SPACE_AGE=true
      - DLC_QUALITY=true
      - DLC_ELEVATED_RAILS=true

      # --- Dynamic Settings Injector (Examples) ---
      - FACTORIO_CONF__name=My Autonomous Factorio Server
      - FACTORIO_CONF__description=Running Factorio 2.0 with Space Age and Auto-Updates.
      - FACTORIO_CONF__max_players=10
      - FACTORIO_CONF__visibility__public=false

    volumes:
      - ./data/saves:/factorio/saves
      - ./data/mods:/factorio/mods
      - ./data/config:/factorio/config
